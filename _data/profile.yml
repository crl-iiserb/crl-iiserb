short_bio: >-
  <p>
    Welcome to the <strong>Cryptography Research Lab</strong> at IISER Bhopal.
  </p>
  <p>
    Cryptography originally emerged as an historic art of secure communication, evolving continuously into the modern digital age. With the ubiquity of global computing infrastructure and the internet, novel and sophisticated security challenges have surfaced. 
    Our lab focuses on addressing these critical vulnerabilities by leveraging rigorous computational frameworks to build advanced, mathematically sound cryptographic systems capable of safeguarding next-generation infrastructure.
  </p>

